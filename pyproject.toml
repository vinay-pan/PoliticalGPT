[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "politicalgpt"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # CUDA-index binding (torch build variant) is deliberately deferred to
    # Phase 4, when the actual RunPod image's CUDA version is known. This
    # dev machine is macOS/arm64 (no CUDA wheels available) and Phase 1
    # does zero GPU work.
    "torch==2.13.0",
    # transformers/trl pinned to the versions STACK.md verified by
    # installation+execution (5.15.1/1.10.0), not current PyPI latest
    # (5.16.1/1.12.0) at time of writing, per RESEARCH.md's "pin what was
    # tested" recommendation.
    "transformers==5.15.1",
    "peft==0.20.0",
    "bitsandbytes==0.50.1",
    "trl==1.10.0",
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sse-starlette==3.4.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

# The repository intentionally uses flat, script-oriented directories rather
# than an installable Python package. Keep `pip install .` available for CI
# dependency installation without asking setuptools to guess among `dial/`,
# `prompts/`, and `configs/` as top-level packages.
[tool.setuptools]
py-modules = []
